schema-version = 1

[package]
title = "BigPrint TV"
version = "0.1.0"
id = "com.bigprint.tv"

[os.version]
min = "1.2"
target = "1.2"

[needs]
# No privileges: audio playback through the W3C media module needs none, and
# "com.amazon.system.audio", declared here before, exists nowhere in the SDK.
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.svg_3@ISVG_0"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

# Read-aloud audio (W3C media AudioPlayer) and the two modules it depends on.
# The build's autolinking appends these two if they are missing, which left
# the working tree dirty after every build; declaring them keeps it clean.
[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"

[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

# Services the W3C media AudioPlayer connects to at runtime. Without these the
# device refuses the IPC connection ("unauthorized access: missing
# [[wants.service]] manifest declaration") and read-aloud is silent, with
# nothing in the app log but "MediaPlayer: pause". Verified on the virtual
# device on 16 Oct 2026. Note that com.amazon.audio.system is required even
# though the media-player setup guide lists only audio.stream and
# audio.control: the device log names it explicitly, and declaring the other
# two alone still fails.
[wants]
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

# The media pipeline talks back to the app over a per-app UUID service.
[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"




[components]
[[components.interactive]]
id = "com.bigprint.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
